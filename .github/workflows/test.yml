name: test

on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    # Weekly check that the pinned discover-real bundle digest still matches
    # the live public registry catalog. Non-blocking for PRs; a failure here
    # is the signal to re-vendor public/bundles/discover-real/.
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  node-tests:
    name: node --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  registry-digest-drift:
    name: registry digest drift (non-blocking)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test tests/discover-bundle.test.mjs
        env:
          CHECK_REGISTRY: "1"
