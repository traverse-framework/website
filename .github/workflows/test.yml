name: test

on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    # Weekly live registry check. Non-blocking for PRs: this job runs only
    # on schedule and workflow_dispatch. It runs tests/discover-planning.test.mjs
    # with CHECK_REGISTRY=1. Offline pins for that file live in
    # public/bundles/discover-real-pipeline/. The networked checks are the
    # CHECK_REGISTRY tests in the same file.
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  node-tests:
    name: node --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  registry-digest-drift:
    name: registry digest drift (non-blocking)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/discover-planning.test.mjs
        env:
          CHECK_REGISTRY: "1"
